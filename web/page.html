<title>Twin Bench</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: instrument bench. One shell (top bar, 3D bench of physical object | digital twin, twin panel,
   six elements, log) shared by every system; a system plugs in its own scene, readouts, chart and what-if. */
:root {
  --bg: #EDF1F4; --panel: #FFFFFF; --ink: #13212C; --muted: #5A6B78; --line: #D3DBE1;
  --twin: #1F5BD8; --twin-soft: #DCE6FB; --heat: #E0532A; --heat-soft: #FBE1D8;
  --ok: #16825A; --warn: #C23A2B; --warn-soft: #F8DEDA; --foam: #E7ECF0; --foam-edge: #8A9AA6;
  --f-display: "Barlow Semi Condensed", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0B1117; --panel: #121A22; --ink: #E3EAF0; --muted: #8C9DAA; --line: #24313C;
  --twin: #6E9BFF; --twin-soft: #1A2A47; --heat: #FF7448; --heat-soft: #3A1E16;
  --ok: #3DBD87; --warn: #FF6B5E; --warn-soft: #3A1A18; --foam: #C9D3DB; --foam-edge: #9FB0BD;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0B1117; --panel: #121A22; --ink: #E3EAF0; --muted: #8C9DAA; --line: #24313C;
  --twin: #6E9BFF; --twin-soft: #1A2A47; --heat: #FF7448; --heat-soft: #3A1E16;
  --ok: #3DBD87; --warn: #FF6B5E; --warn-soft: #3A1A18; --foam: #C9D3DB; --foam-edge: #9FB0BD;
  color-scheme: dark; }

body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 14px; line-height: 1.45;
       padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
       padding-block: 14px 28px; }
.wrap { max-width: 1320px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
h1, h2, h3 { font-family: var(--f-display); margin: 0; text-wrap: balance; }
.num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--twin); outline-offset: 2px; }

.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 20px; }
.brand h1 { font-size: 30px; font-weight: 700; letter-spacing: .01em; line-height: 1.05; }
.brand p { margin: 4px 0 0; color: var(--muted); max-width: 66ch; }
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--panel); }
.seg button { border: 0; background: transparent; padding: 6px 11px; cursor: pointer; white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--panel); }
.seg.sys button { font-family: var(--f-display); font-weight: 600; font-size: 15px; padding: 6px 14px; }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 6px 12px; cursor: pointer; white-space: nowrap; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--twin); border-color: var(--twin); color: #fff; font-weight: 600; }
.btn:disabled, .seg button:disabled { opacity: .45; cursor: not-allowed; }
.clock { font-family: var(--f-mono); color: var(--muted); padding: 0 4px; min-width: 10ch; text-align: right; }

.main { display: grid; grid-template-columns: minmax(0, 1.45fr) minmax(0, 1fr); gap: 14px; align-items: start; }
@media (max-width: 980px) { .main { grid-template-columns: minmax(0, 1fr); } .main > .leftcol { display: contents; }
  .scenecard { order: 1; } .twinp { order: 2; } .elements { order: 3; } }
.leftcol { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); min-width: 0; }
.label { font-family: var(--f-display); font-weight: 600; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

.scene { position: relative; height: clamp(260px, min(52vh, 72vw), 520px); border-bottom: 1px solid var(--line); overflow: hidden;
         border-radius: var(--r) var(--r) 0 0; touch-action: none; }
.scene canvas { display: block; width: 100%; height: 100%; }
.tag { position: absolute; transform: translate(-50%, -50%); pointer-events: none; white-space: nowrap;
       font-family: var(--f-mono); font-size: 12px; padding: 2px 6px; border-radius: 5px;
       background: var(--panel); border: 1px solid var(--line); color: var(--ink); }
.tag.big { font-family: var(--f-display); font-weight: 700; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; border: 0; background: transparent; }
.tag.twin { border-color: var(--twin); color: var(--twin); }
.tag.heat { border-color: var(--heat); color: var(--heat); }
.tag.flow { border: 0; background: transparent; color: var(--muted); font-size: 11px; }
.tag.warn { border-color: var(--warn); color: var(--warn); background: var(--warn-soft); }
.scene .hint { position: absolute; left: 12px; bottom: 10px; color: var(--muted); font-size: 12px; pointer-events: none; }
.scene .nogl { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 24px; color: var(--muted); }

.world { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; padding: 12px 14px; }
.world .label { width: 100%; }
.ctl { display: flex; align-items: center; gap: 8px; }
.ctl input[type="range"] { width: 140px; accent-color: var(--twin); }
.check { display: flex; align-items: center; gap: 6px; cursor: pointer; }
.check input { accent-color: var(--twin); }
.world .meta { color: var(--muted); font-size: 13px; }
.world .seg { flex-wrap: wrap; }

.twinp { display: flex; flex-direction: column; }
.twinp header { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; padding: 12px 14px 0; flex-wrap: wrap; }
.twinp header h2 { font-size: 20px; font-weight: 700; color: var(--twin); }
.readouts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1px; background: var(--line);
            margin: 10px 14px 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.ro { background: var(--panel); padding: 9px 11px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.ro .k { font-size: 12px; color: var(--muted); }
.ro .v { font-family: var(--f-mono); font-variant-numeric: tabular-nums; font-size: 20px; font-weight: 500; min-height: 1.45em; }
.ro .s { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.pill { display: inline-block; font-family: var(--f-body); font-size: 12px; font-weight: 600; padding: 1px 8px; border-radius: 999px; }
.pill.ok { color: var(--ok); background: color-mix(in srgb, var(--ok) 14%, transparent); }
.pill.bad { color: var(--warn); background: var(--warn-soft); }
.pill.heat { color: var(--heat); background: var(--heat-soft); }
.pill.off { color: var(--muted); background: color-mix(in srgb, var(--muted) 14%, transparent); }
.pill.twin { color: var(--twin); background: var(--twin-soft); }

.chartbox { padding: 12px 14px 4px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
.legend i { display: inline-block; width: 16px; height: 0; border-top: 2px solid; vertical-align: middle; margin-right: 5px; }
.legend i.dash { border-top-style: dashed; }
.legend i.dot { width: 6px; height: 6px; border: 0; border-radius: 50%; }
.legend i.box { width: 12px; height: 8px; border: 0; }
.chart { position: relative; height: 230px; }
.chart canvas { width: 100%; height: 100%; display: block; }

.whatif { margin: 8px 14px 14px; border: 1px solid var(--twin); border-radius: 8px; padding: 11px 12px; display: flex; flex-direction: column; gap: 9px;
          background: color-mix(in srgb, var(--twin-soft) 55%, var(--panel)); }
.whatif .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
.whatif .slab { font-size: 13px; width: 100%; }
.whatif input[type="range"] { flex: 1 1 160px; min-width: 120px; accent-color: var(--twin); }
.whatif .val { font-family: var(--f-mono); font-size: 18px; font-weight: 500; color: var(--twin); min-width: 7ch; }
.metrics { display: grid; grid-template-columns: auto repeat(2, minmax(0, 1fr)); gap: 3px 12px; font-size: 13px; }
.metrics .h { color: var(--muted); font-size: 12px; }
.metrics .num { text-align: right; }
.whatif .note { font-size: 12px; color: var(--muted); }

.elements { padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
.el-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px 16px; }
@media (max-width: 640px) { .el-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.el { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.el b { font-family: var(--f-display); font-size: 15px; }
.el b span { font-family: var(--f-mono); color: var(--twin); margin-right: 6px; }
.el p { margin: 0; color: var(--muted); font-size: 13px; }
.pgrid { display: grid; grid-template-columns: repeat(5, 18px); gap: 2px; }
.pgrid .pc { width: 18px; height: 18px; border-radius: 3px; display: grid; place-items: center; }
.pgrid .pc.p3 { background: var(--heat-soft); outline: 1px solid var(--heat); outline-offset: -1px; }
.pgrid .pc.p2 { background: var(--line); }
.pgrid .pc i { width: 10px; height: 10px; border-radius: 50%; background: var(--ink); }
.skeleton { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 10px; }
.skeleton code { font-family: var(--f-mono); font-size: 12px; padding: 1px 6px; border-radius: 5px; background: var(--twin-soft); color: var(--twin); }
.skeleton code.no { background: transparent; color: var(--muted); text-decoration: line-through; border: 1px dashed var(--line); }

.lower { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; align-items: start; }
@media (max-width: 980px) { .lower { grid-template-columns: minmax(0, 1fr); } }
.log { padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
.log ol { list-style: none; margin: 0; padding: 0; max-height: 210px; overflow: auto; display: flex; flex-direction: column; gap: 4px; }
.log li { display: grid; grid-template-columns: 10ch minmax(0, 1fr); gap: 10px; font-size: 13px; }
.log li time { font-family: var(--f-mono); color: var(--muted); }
.log li.bad { color: var(--warn); }
.log li.cmd { color: var(--twin); }
.about { padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--muted); }
.about p { margin: 0; max-width: 72ch; }
.about a { color: var(--twin); }
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>Twin Bench</h1>
      <p id="subtitle">One small skeleton, several systems: each digital twin below runs on the same loop.</p>
    </div>
    <div class="bar" role="toolbar" aria-label="Run controls">
      <div class="seg sys" id="sysSeg" aria-label="System">
        <button data-sys="incubator" aria-pressed="true" id="sysInc">Incubator</button>
        <button data-sys="battery" aria-pressed="false" id="sysBat">Battery</button>
        <button data-sys="uav" aria-pressed="false" id="sysUav">UAV</button>
      </div>
      <button class="btn" id="play" aria-label="Pause">❚❚</button>
      <div class="seg" id="speedSeg" aria-label="Speed"></div>
      <span class="clock" id="clock">–</span>
      <button class="btn" id="reset">Reset</button>
      <div class="seg" id="langSeg"><button data-lang="en" aria-pressed="true">EN</button><button data-lang="zh" aria-pressed="false">中文</button></div>
    </div>
  </header>

  <div class="main">
    <div class="leftcol">
      <section class="card scenecard" aria-label="Physical object and digital twin">
        <div class="scene" id="scene"><div class="hint" id="dragHint">Drag to rotate · scroll to zoom</div></div>
        <div class="world"><span class="label" id="worldTitle">Physical side</span><div id="world" style="display:contents"></div></div>
      </section>
      <section class="card elements" aria-label="Six elements">
        <span class="label" id="elTitle">The six elements of this twin</span>
        <div class="el-grid" id="elGrid"></div>
        <div class="skeleton" id="skeleton"></div>
      </section>
    </div>

    <aside class="card twinp" aria-label="Digital twin">
      <header><h2 id="twinTitle">Digital twin</h2><span class="label" id="twinSees"></span></header>
      <div class="readouts">
        <div class="ro"><span class="k" id="ro0k"></span><span class="v" id="ro0v"></span><span class="s" id="ro0s"></span></div>
        <div class="ro"><span class="k" id="ro1k"></span><span class="v" id="ro1v"></span><span class="s" id="ro1s"></span></div>
        <div class="ro"><span class="k" id="ro2k"></span><span class="v" id="ro2v"></span><span class="s" id="ro2s"></span></div>
        <div class="ro"><span class="k" id="ro3k"></span><span class="v" id="ro3v"></span><span class="s" id="ro3s"></span></div>
      </div>
      <div class="chartbox">
        <div class="legend" id="legend"></div>
        <div class="chart"><canvas id="chart"></canvas></div>
      </div>
      <div class="whatif">
        <span class="label" style="color:var(--twin)" id="wiTitle"></span>
        <div class="row">
          <label class="slab" for="try" id="wiSlider"></label>
          <input type="range" id="try">
          <span class="val" id="tryV"></span>
          <button class="btn primary" id="send"></button>
        </div>
        <div class="metrics" id="metrics"></div>
        <div class="note" id="wiNote"></div>
      </div>
    </aside>
  </div>

  <div class="lower">
    <section class="card log"><span class="label" id="logTitle">Event log</span><ol id="log"></ol></section>
    <section class="card about"><span class="label" id="aboutTitle">What is real here</span><p id="aboutText"></p><p id="aboutLinks"></p></section>
  </div>
</div>

<script>
/* The real incubator replay ships only with the local copy (that dataset has no license for redistribution). */
if (location.protocol === 'file:' || /^(localhost|127\.0\.0\.1)$/.test(location.hostname)) document.write('<script src="replay_2023.js"><\/script>');
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="incubator_core.js"></script>
<script src="battery_core.js"></script>
<script src="battery_cells.js"></script>
<script src="uav_model.js"></script>
<script src="uav_core.js"></script>
<script>
(function () {
'use strict';
const $ = id => document.getElementById(id);
const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
                set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const f1 = v => (v === undefined || v === null || !isFinite(v)) ? '–' : v.toFixed(1);
const f2s = v => (v === undefined || v === null || !isFinite(v)) ? '–' : (v >= 0 ? '+' : '') + v.toFixed(2);
const fint = v => (v === undefined || v === null || !isFinite(v)) ? '–' : Math.round(v).toLocaleString('en-US');

// ======================= shell text =======================
const SHELL = {
  en: { subtitle: 'One small skeleton, several systems: each digital twin below runs on the same loop.',
        reset: 'Reset', dragHint: 'Drag to rotate · scroll to zoom', twinTitle: 'Digital twin', logTitle: 'Event log',
        aboutTitle: 'What is real here', elTitle: 'The six elements of this twin (Kapteyn et al. 2021)',
        skeleton: 'Same skeleton (dtcore):', sys: { incubator: 'Incubator', battery: 'Battery', uav: 'UAV' }, notSupported: 'not supported' },
  zh: { subtitle: '一个小骨架，多个系统：下面每个数字孪生都跑在同一个循环上。',
        reset: '重置', dragHint: '拖动旋转 · 滚轮缩放', twinTitle: '数字孪生', logTitle: '事件记录',
        aboutTitle: '哪些是真的', elTitle: '这个孪生的六要素（Kapteyn 等 2021）',
        skeleton: '同一个骨架（dtcore）：', sys: { incubator: '培养箱', battery: '电池', uav: '无人机' }, notSupported: '不支持' }
};
const SH = { lang: store.get('twb-lang') || ((navigator.language || '').toLowerCase().startsWith('zh') ? 'zh' : 'en'),
             key: null, dom: null, running: !matchMedia('(prefers-reduced-motion: reduce)').matches, speedIdx: 1,
             log: [], acc: 0, cmdPulse: 0 };
const T = k => SHELL[SH.lang][k];
const D = k => SH.dom.TXT[SH.lang][k];
function addLog(kind, text) { SH.log.unshift({ t: SH.dom.clockOf ? SH.dom.clockOf() : '', kind, text }); if (SH.log.length > 80) SH.log.pop(); renderLog(); }
function renderLog() { $('log').innerHTML = SH.log.map(e => `<li class="${e.kind}"><time>${e.t}</time><span>${e.text}</span></li>`).join(''); }

// ======================= 3D shell =======================
const G = { ok: false, tags: {} };
function tempColor(v, lo, hi, stops) {
  stops = stops || [[0, [0.55, 0.70, 0.88]], [0.5, [0.95, 0.76, 0.31]], [1, [0.88, 0.33, 0.16]]];
  const f = Math.min(1, Math.max(0, (v - lo) / (hi - lo)));
  for (let i = 1; i < stops.length; i++) if (f <= stops[i][0]) { const [a, ca] = stops[i - 1], [b, cb] = stops[i], u = (f - a) / (b - a);
    return new THREE.Color(ca[0] + (cb[0] - ca[0]) * u, ca[1] + (cb[1] - ca[1]) * u, ca[2] + (cb[2] - ca[2]) * u); }
  return new THREE.Color(...stops[stops.length - 1][1]);
}
const col = name => new THREE.Color(css(name) || '#888');
function initThree() {
  const host = $('scene');
  if (!window.THREE || !THREE.OrbitControls) { host.insertAdjacentHTML('beforeend', '<div class="nogl">3D view unavailable (three.js did not load). The twin keeps running on the right.</div>'); return; }
  let renderer;
  try { renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true }); } catch (e) { host.insertAdjacentHTML('beforeend', '<div class="nogl">3D view needs WebGL. The twin keeps running on the right.</div>'); return; }
  renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
  host.prepend(renderer.domElement);
  const scene = new THREE.Scene(), camera = new THREE.PerspectiveCamera(36, 1, 0.01, 30);
  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true; controls.minDistance = 0.5; controls.maxPolarAngle = Math.PI * 0.49; controls.enablePan = false;
  scene.add(new THREE.HemisphereLight(0xffffff, 0x8899aa, 0.85));
  const sun = new THREE.DirectionalLight(0xffffff, 0.55); sun.position.set(1, 2, 1.5); scene.add(sun);
  const floor = new THREE.Mesh(new THREE.CircleGeometry(1.8, 48), new THREE.MeshBasicMaterial({ transparent: true, opacity: 0.35 }));
  floor.rotation.x = -Math.PI / 2; scene.add(floor);
  Object.assign(G, { ok: true, renderer, scene, camera, controls, floor, host });
  new ResizeObserver(fitCamera).observe(host);
}
function fitCamera() {
  if (!G.ok || !SH.dom) return;
  const r = G.host.getBoundingClientRect(), v = SH.dom.view;
  G.renderer.setSize(r.width, r.height, false);
  G.camera.aspect = r.width / Math.max(1, r.height); G.camera.updateProjectionMatrix();
  const hfov = 2 * Math.atan(Math.tan(G.camera.fov * Math.PI / 360) * G.camera.aspect);
  const dist = Math.max(v.minDist, v.halfWidth / Math.tan(hfov / 2));
  G.controls.target.set(...v.target); G.controls.maxDistance = dist * 1.6;
  G.camera.position.copy(new THREE.Vector3(...v.dir).normalize().multiplyScalar(dist)).add(G.controls.target);
}
/* links between the physical object and the twin: observation dots and a command pulse */
function makeLinks(group, x0, x1, yObs, yCmd, lift) {
  const arc = (y, l, z) => new THREE.QuadraticBezierCurve3(new THREE.Vector3(x0, y, z), new THREE.Vector3((x0 + x1) / 2, y + l, z), new THREE.Vector3(x1, y, z));
  const obs = arc(yObs, lift, -0.05), cmd = arc(yCmd, lift * 0.4, 0.1);
  const line = c => new THREE.Line(new THREE.BufferGeometry().setFromPoints(c.getPoints(40)), new THREE.LineBasicMaterial({ transparent: true, opacity: 0.6 }));
  const lo = line(obs), lc = line(cmd); group.add(lo, lc);
  const dots = [], cdots = [];
  for (let i = 0; i < 6; i++) { const m = new THREE.Mesh(new THREE.SphereGeometry(0.008, 10, 8), new THREE.MeshBasicMaterial()); group.add(m); dots.push(m); }
  for (let i = 0; i < 3; i++) { const m = new THREE.Mesh(new THREE.SphereGeometry(0.011, 10, 8), new THREE.MeshBasicMaterial()); group.add(m); cdots.push(m); }
  return { obs, cmd, lo, lc, dots, cdots,
    theme() { lo.material.color = col('--muted'); lc.material.color = col('--twin'); dots.forEach(d => d.material.color = col('--ink')); cdots.forEach(d => d.material.color = col('--twin')); },
    update(dt, t) {
      const k = SH.running ? t * 0.00035 : 0;

    const pill = u => u ? `<span class="pill heat">${t('t3')}</span>` : `<span class="pill ok">${t('t2')}</span>`;
    return [
      { k: t('ro1'), v: f1(e.est1) + ' %', s: `${t('trueSim')} ${o.true1} %` },
      { k: t('ro2'), v: f1(e.est2) + ' %', s: `${t('trueSim')} ${o.true2} %` },
      { k: t('roMap'), v: `(${e.map[0]}, ${e.map[1]}) %`, s: `${t('prob')} ${e.pmax.toFixed(2)}` },
      { k: t('roNext'), v: pill(d.u), s: `${t('bank')} ${bankDeg(d.u)}° · ${t('vote')} ${d.p3g.toFixed(2)}` }];
  }
  function legend() {
    return `<span><i style="border-color:var(--ink)"></i>${t('lgT1')}</span><span><i class="dash" style="border-color:var(--ink)"></i>${t('lgT2')}</span>` +
      `<span><i style="border-color:var(--twin)"></i>${t('lgE1')}</span><span><i class="dash" style="border-color:var(--twin)"></i>${t('lgE2')}</span>` +
      `<span><i class="box" style="background:var(--heat)"></i>${t('lgU')}</span>`;
  }
  function drawChart() {
    const fr = chartFrame(); if (!fr || !S.hist.length) return; const { r, C } = fr;
    const N = 80, H = S.hist.slice(-N), k1 = H[H.length - 1].k, k0 = Math.max(0, k1 - N + 1);
    const L = 38, Rm = 8, Top = 8, strip = 10, Bot = 22 + strip + 4, W = r.width - L - Rm, Hh = r.height - Top - Bot;
    const x = k => L + (k - k0) / Math.max(1, N - 1) * W, y = v => Top + (85 - v) / 90 * Hh;
    ctx.strokeStyle = C.line; ctx.lineWidth = 1; ctx.fillStyle = C.muted; ctx.textAlign = 'right';
    for (let v = 0; v <= 80; v += 20) { ctx.beginPath(); ctx.moveTo(L, y(v) + .5); ctx.lineTo(L + W, y(v) + .5); ctx.stroke(); ctx.fillText(v + '%', L - 6, y(v)); }
    ctx.textAlign = 'center'; const st = W < 380 ? 40 : 20;
    for (let k = Math.ceil(k0 / st) * st; k <= k1; k += st) ctx.fillText(String(k), x(k), r.height - 8);
    ctx.textAlign = 'left'; ctx.fillText(t('turn'), 2, r.height - 8);
    const sy = Top + Hh + 6, bw = Math.max(1, W / N - 1);
    H.forEach(p => { ctx.fillStyle = p.u ? C.heat : C.line; ctx.fillRect(x(p.k) - bw / 2, sy, bw, strip); });
    const step = (pts, color, w, dash) => { ctx.strokeStyle = color; ctx.lineWidth = w; ctx.setLineDash(dash || []); ctx.beginPath();
      pts.forEach(([a, b], i) => { if (!i) ctx.moveTo(x(a), y(b)); else { ctx.lineTo(x(a), y(pts[i - 1][1])); ctx.lineTo(x(a), y(b)); } }); ctx.stroke(); ctx.setLineDash([]); };
    step(H.map(p => [p.k, p.t1]), C.ink, 1.8); step(H.map(p => [p.k, p.t2]), C.ink, 1.4, [4, 3]);
    lineXY(H.map(p => [p.k, p.e1]), x, y, C.twin, 1.6); lineXY(H.map(p => [p.k, p.e2]), x, y, C.twin, 1.4, [4, 3]);
  }
  function policyGrid(pol, belief) {
    let h = `<div style="grid-column:1/-1;display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:4px"><div class="pgrid">`;
    for (let i = 0; i < 5; i++) for (let j = 0; j < 5; j++) { const s = i * 5 + j, b = belief ? belief[s] : 0;
      h += `<span class="pc ${pol[s] ? 'p3' : 'p2'}" title="(${i * 20}, ${j * 20}) %">${b > 0.02 ? `<i style="transform:scale(${Math.min(1, 0.35 + b).toFixed(2)})"></i>` : ''}</span>`; }
    return h + `</div><span class="note">${t('gridR')}<br>${t('gridC')}<br><span class="pill heat">3g</span> <span class="pill off">2g</span></span></div>`;
  }
  const whatif = {
    cfg: () => ({ min: 1.8, max: 3.4, step: 0.05, value: S.alphaTry }),
    fmt: v => v.toFixed(2),
    onTry(v) { S.alphaTry = v; forecast(); },
    metrics() {
      if (!S.wiNow) return '';
      const a = S.wiNow, b = S.wiTry, h = t('mHead'), n = p => p.reduce((x, y) => x + y, 0);
      return `<span class="h">${h[0]}</span><span class="h num">${h[1]} · ${S.tw.alpha2.toFixed(2)}</span><span class="h num" style="color:var(--twin)">${h[2]} · ${S.alphaTry.toFixed(2)}</span>` +
        `<span>${t('m3gStates')}</span><span class="num">${n(a.policy)} / 25</span><span class="num">${n(b.policy)} / 25</span>` +
        `<span>${t('m3g')}</span><span class="num">${a.n3g.toFixed(1)}</span><span class="num">${b.n3g.toFixed(1)}</span>` +
        `<span>${t('mD1')}</span><span class="num">${a.mean_d1.toFixed(1)} %</span><span class="num">${b.mean_d1.toFixed(1)} %</span>` +
        `<span>${t('mP60')}</span><span class="num">${a.p_d1_60.toFixed(2)}</span><span class="num">${b.p_d1_60.toFixed(2)}</span>` +
        policyGrid(b.policy, S.est ? S.est.belief : null);
    },
    canSend: () => !!S.tw,
    send() { S.tw.setPolicy(S.alphaTry); SH.cmdPulse = 1; addLog('cmd', t('ev').send(S.alphaTry.toFixed(2), S.tw.pol.reduce((x, y) => x + y, 0))); },
    note: () => t('wiNote')
  };
  // ---------- 3D ----------
  const sc = {}, GAP = 0.55, SPAN = 0.9, RG = [[0.08, 0.2], [0.24, 0.36]];
  function dmgColor(v) { return tempColor(v, 0, 80, [[0, [0.20, 0.65, 0.45]], [0.5, [0.95, 0.70, 0.25]], [1, [0.85, 0.25, 0.18]]]); }
  function buildScene(group) {
    function plane(cx, twin) {
      const g = new THREE.Group(); g.position.set(cx, 0.24, 0); group.add(g);
      const body = new THREE.Group(); g.add(body);
      const mat = twin ? new THREE.MeshBasicMaterial({ transparent: true, opacity: 0.08, depthWrite: false })
                       : new THREE.MeshStandardMaterial({ roughness: 0.55, metalness: 0.1 });
      const edgeMat = new THREE.LineBasicMaterial({ transparent: true, opacity: twin ? 0.9 : 0.35 });
      const add = (geo, pos, rot) => { const m = new THREE.Mesh(geo, mat); m.position.set(...pos); if (rot) m.rotation.set(...rot); body.add(m);
        const e = new THREE.LineSegments(new THREE.EdgesGeometry(geo, 25), edgeMat); e.position.copy(m.position); e.rotation.copy(m.rotation); body.add(e); return m; };
      add(new THREE.CylinderGeometry(0.03, 0.02, 0.56, 16), [0, 0, 0.02], [Math.PI / 2, 0, 0]);
      add(new THREE.ConeGeometry(0.03, 0.08, 16), [0, 0, -0.3], [-Math.PI / 2, 0, 0]);
      add(new THREE.BoxGeometry(SPAN, 0.012, 0.14), [0, 0.012, -0.06]);
      add(new THREE.BoxGeometry(0.3, 0.008, 0.07), [0, 0.01, 0.26]);
      add(new THREE.BoxGeometry(0.008, 0.08, 0.07), [0, 0.05, 0.26]);
      const patches = RG.map(([a, b]) => { const m = new THREE.Mesh(new THREE.BoxGeometry(b - a, 0.016, 0.12),
        new THREE.MeshStandardMaterial({ roughness: 0.6, transparent: twin, opacity: twin ? 0.85 : 1 })); m.position.set((a + b) / 2, 0.013, -0.06); body.add(m); return m; });
      if (!twin) for (let i = 0; i < 24; i++) { const side = i < 12 ? 1 : -1, j = i % 12, xx = side * (0.06 + j * 0.033), zz = -0.06 + (j % 2 ? 0.035 : -0.035);
        const d = new THREE.Mesh(new THREE.SphereGeometry(0.0055, 8, 6), new THREE.MeshBasicMaterial({ color: 0x334455 })); d.position.set(xx, 0.022, zz); body.add(d); }
      return { g, body, mat, edgeMat, patches, roll: 0 };
    }
    sc.phys = plane(-GAP, false); sc.twin = plane(GAP, true);
    sc.links = makeLinks(group, -GAP + 0.25, GAP - 0.25, 0.42, 0.33, 0.14);
    const V = (a, b, c) => new THREE.Vector3(a, b, c);
    sc.anchors = { physName: V(-GAP, 0.52, -0.05), twinName: V(GAP, 0.52, -0.05), p1: V(-GAP + 0.14, 0.36, 0.1), p2: V(-GAP + 0.33, 0.29, 0.13),
      q1: V(GAP + 0.14, 0.36, 0.1), q2: V(GAP + 0.33, 0.29, 0.13), pm: V(-GAP - 0.28, 0.16, 0.12), qm: V(GAP - 0.28, 0.16, 0.12),
      obs: sc.links.obs.getPoint(0.5).clone().add(V(0, 0.03, 0)), cmd: sc.links.cmd.getPoint(0.5).clone().add(V(0, -0.035, 0)) };
    theme();
  }
  function theme() {
    if (!sc.phys) return;
    sc.phys.mat.color = col('--foam'); sc.phys.edgeMat.color = col('--foam-edge');
    sc.twin.mat.color = col('--twin'); sc.twin.edgeMat.color = col('--twin'); sc.links.theme();
  }
  function update3D(dt, now) {
    const o = S.last, e = S.est, d = S.next;
    if (o && e) {
      sc.phys.patches[0].material.color = dmgColor(o.true1); sc.phys.patches[1].material.color = dmgColor(o.true2);
      sc.twin.patches[0].material.color = dmgColor(e.est1); sc.twin.patches[1].material.color = dmgColor(e.est2);
      const target = -(bankDeg(o.u) * Math.PI / 180) * 0.42, tTwin = -(bankDeg(d.u) * Math.PI / 180) * 0.42;
      sc.phys.roll += (target - sc.phys.roll) * Math.min(1, dt * 0.004); sc.twin.roll += (tTwin - sc.twin.roll) * Math.min(1, dt * 0.004);
      sc.phys.body.rotation.z = sc.phys.roll; sc.twin.body.rotation.z = sc.twin.roll;
      const bob = Math.sin(now * 0.0015) * 0.006; sc.phys.g.position.y = 0.24 + bob; sc.twin.g.position.y = 0.24 + bob;
    }
    sc.links.update(dt, now);
  }
  function tags(narrow) {
    const o = S.last, e = S.est, d = S.next, A = sc.anchors;
    const L = [{ key: 'physName', pos: A.physName, cls: 'big', text: narrow ? t('physical') : t('physicalSim') },
               { key: 'twinName', pos: A.twinName, cls: 'big twin', text: t('twin') }];
    if (o && e) L.push(
      { key: 'p1', pos: A.p1, text: `${t('r1')} ${o.true1}%`, show: !narrow }, { key: 'p2', pos: A.p2, text: `${t('r2')} ${o.true2}%`, show: !narrow },
      { key: 'q1', pos: A.q1, cls: 'twin', text: `${t('est')} ${Math.round(e.est1)}%` }, { key: 'q2', pos: A.q2, cls: 'twin', text: `${t('est')} ${Math.round(e.est2)}%`, show: !narrow },
      { key: 'pm', pos: A.pm, cls: o.u ? 'heat' : '', text: o.u ? t('t3') : t('t2'), show: !narrow },
      { key: 'qm', pos: A.qm, cls: 'twin', text: `${t('cmdFlow').replace('← ', '')}: ${d.u ? '3g' : '2g'}`, show: !narrow },
      { key: 'obs', pos: A.obs, cls: 'flow', text: t('obsFlow'), show: !narrow }, { key: 'cmd', pos: A.cmd, cls: 'flow', text: t('cmdFlow'), show: !narrow });
    return L;
  }
  return { key: 'uav', TXT, speeds: [1, 2, 6], speedLabel: v => v + '/s', rate: v => v,
           view: { target: [0, 0.22, -0.02], dir: [0, 0.95, 1.55], halfWidth: 1.25, minDist: 1.75 },
           caps: ['update', 'predict', 'whatif', 'decide'], init, step, forecast, renderWorld, readouts, legend, drawChart, whatif, buildScene, theme, update3D, tags,
           clockOf: () => S.last ? `${t('turn')} ${S.last.t}` : '–', available: !!U,
           links: '<a href="https://www.nature.com/articles/s43588-021-00069-0" target="_blank" rel="noopener">Kapteyn, Pretorius & Willcox 2021</a> · <a href="https://github.com/michaelkapteyn/UAV-Digital-Twin" target="_blank" rel="noopener">authors’ code and data (BSD 3-Clause)</a>' };
})();

const DOMAINS = { incubator: Inc, battery: Bat, uav: Uav };

// ======================= shell wiring =======================
function renderSpeeds() {
  const d = SH.dom; $('speedSeg').innerHTML = d.speeds.map((v, i) => `<button data-i="${i}" aria-pressed="${i === SH.speedIdx}">${d.speedLabel(v)}</button>`).join('');
  $('speedSeg').querySelectorAll('button').forEach(b => b.onclick = () => { SH.speedIdx = Number(b.dataset.i); renderSpeeds(); });
}
function renderStatic() {
  const d = SH.dom;
  document.documentElement.lang = SH.lang === 'zh' ? 'zh-CN' : 'en';
  $('subtitle').textContent = T('subtitle') + ' ' + D('subtitle');
  $('reset').textContent = T('reset'); $('dragHint').textContent = T('dragHint'); $('twinTitle').textContent = T('twinTitle');
  $('logTitle').textContent = T('logTitle'); $('aboutTitle').textContent = T('aboutTitle'); $('elTitle').textContent = T('elTitle');
  $('sysInc').textContent = T('sys').incubator; $('sysBat').textContent = T('sys').battery; $('sysUav').textContent = T('sys').uav;
  document.querySelectorAll('#sysSeg button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.sys === d.key)));
  document.querySelectorAll('#langSeg button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === SH.lang)));
  $('worldTitle').textContent = D('worldTitle'); $('twinSees').textContent = D('twinSees');
  $('wiTitle').textContent = D('wiTitle'); $('wiSlider').textContent = D('wiSlider'); $('send').textContent = D('send');
  $('elGrid').innerHTML = D('els').map(([k, n, x]) => `<div class="el"><b><span>${k}</span>${n}</b><p>${x}</p></div>`).join('');
  const all = ['update', 'predict', 'whatif', 'decide'];
  $('skeleton').innerHTML = `<span>${T('skeleton')}</span>` + all.map(c => `<code class="${d.caps.includes(c) ? '' : 'no'}" title="${d.caps.includes(c) ? '' : T('notSupported')}">${c}()</code>`).join('') + '<code>observe()</code><code>act()</code>';
  $('aboutText').textContent = D('about'); $('aboutLinks').innerHTML = d.links;
  $('legend').innerHTML = d.legend();
  d.renderWorld($('world'));
  const cfg = d.whatif.cfg(), sl = $('try'); sl.min = cfg.min; sl.max = cfg.max; sl.step = cfg.step; sl.value = cfg.value;
  syncPlay();
}
function refreshPanel() {
  const d = SH.dom, ro = d.readouts();
  for (let i = 0; i < 4; i++) { const r = ro[i] || { k: '', v: '', s: '' }; $('ro' + i + 'k').textContent = r.k; $('ro' + i + 'v').innerHTML = r.v; $('ro' + i + 's').innerHTML = r.s; }
  $('clock').textContent = d.clockOf();
  $('tryV').textContent = d.whatif.fmt(Number($('try').value));
  $('metrics').innerHTML = d.whatif.metrics(); $('wiNote').textContent = d.whatif.note();
  $('send').disabled = !d.whatif.canSend();
  $('legend').innerHTML = d.legend();
  d.drawChart();
}
function refreshAll() { renderStatic(); refreshPanel(); renderLog(); }
SH.refreshAll = refreshAll; SH.refreshPanel = refreshPanel;
function syncPlay() { $('play').textContent = SH.running ? '❚❚' : '▶'; $('play').setAttribute('aria-label', SH.running ? 'Pause' : 'Play'); }

function switchDomain(key) {
  SH.key = key; SH.dom = DOMAINS[key]; SH.log = []; SH.acc = 0; SH.speedIdx = 1; store.set('twb-sys', key);
  if (G.ok) { if (G.group) G.scene.remove(G.group); clearTags(); G.group = new THREE.Group(); G.scene.add(G.group); SH.dom.buildScene(G.group); G.floor.material.color = col('--line'); fitCamera(); }
  SH.dom.init(); renderSpeeds(); refreshAll();
}

let lastReal = performance.now(), panelT = 0, fcT = 0;
function frame(now) {
  const dt = Math.min(100, now - lastReal); lastReal = now; const d = SH.dom;
  if (SH.running) {
    SH.acc += dt / 1000 * d.rate(d.speeds[SH.speedIdx]);
    let n = 0;
    while (SH.acc >= 1 && n < 400) { if (!d.step()) { SH.acc = 0; SH.running = false; syncPlay(); d.forecast(); refreshPanel(); break; } SH.acc -= 1; n++; }
    panelT += dt; fcT += dt;
    if (fcT > 700) { d.forecast(); fcT = 0; }
    if (panelT > 120) { refreshPanel(); panelT = 0; }
  }
  if (G.ok) { d.update3D(dt, now); G.controls.update(); G.renderer.render(G.scene, G.camera); placeTags(d.tags(G.host.getBoundingClientRect().width < 560)); }
  requestAnimationFrame(frame);
}

$('play').onclick = () => { SH.running = !SH.running; syncPlay(); };
$('reset').onclick = () => { SH.log = []; SH.dom.init(); SH.running = true; refreshAll(); };
document.querySelectorAll('#sysSeg button').forEach(b => b.onclick = () => { if (b.dataset.sys !== SH.key) { SH.running = true; switchDomain(b.dataset.sys); } });
document.querySelectorAll('#langSeg button').forEach(b => b.onclick = () => { SH.lang = b.dataset.lang; store.set('twb-lang', SH.lang); refreshAll(); });
$('try').oninput = () => { SH.dom.whatif.onTry(Number($('try').value)); refreshPanel(); };
$('send').onclick = () => { SH.dom.whatif.send(); SH.dom.forecast(); refreshPanel(); };
new ResizeObserver(() => SH.dom && SH.dom.drawChart()).observe($('chart').parentElement);
const reTheme = () => { if (G.ok) { SH.dom.theme(); G.floor.material.color = col('--line'); } SH.dom.drawChart(); };
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', reTheme);
new MutationObserver(reTheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

initThree();
const startKey = ['#battery', '#incubator', '#uav'].includes(location.hash) ? location.hash.slice(1) : (store.get('twb-sys') || 'incubator');
switchDomain(DOMAINS[startKey] ? startKey : 'incubator');
requestAnimationFrame(frame);
})();
</script>
